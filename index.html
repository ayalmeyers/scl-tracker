<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCL Revenue Tracker</title>
  
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; background: #F6F7F9; color: #1A1D23; }
    #root { height: 100vh; overflow-y: auto; }
  </style>
</head>
<body>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      const errDiv = document.createElement('div');
      errDiv.style = 'padding:16px;background:#FEF2F2;color:#B91C1C;font-family:sans-serif;border:1px solid #FCA5A5;margin:12px;border-radius:8px;font-size:12px;';
      errDiv.innerHTML = '<h4 style="margin:0 0 6px 0;font-size:13px;">Add-in Execution Error</h4>' +
                         '<p style="margin:0 0 4px 0;"><b>Details:</b> ' + message + '</p>' +
                         '<p style="margin:0;color:#7F1D1D;font-size:11px;">Line ' + lineno + ' inside ' + source.split('/').pop() + '</p>';
      document.body.insertBefore(errDiv, document.body.firstChild);
      return false;
    };
  </script>

  <div id="root"></div>
  
  <script src="taskpane.js" defer></script>
</body>
</html>
